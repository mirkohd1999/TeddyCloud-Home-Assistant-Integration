name: Validate HACS integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate for HACS
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Home Assistant manifest and integration
        uses: home-assistant/actions/hassfest@master

  package-checks:
    name: Syntax and packaging checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m compileall -q custom_components/teddycloud_homeassistant
      - name: Ear-button MQTT payload tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Lovelace JavaScript syntax
        run: |
          node --check custom_components/teddycloud_homeassistant/teddycloud-homeassistant-card.js
          node --check www/teddycloud-homeassistant-card.js
          cmp custom_components/teddycloud_homeassistant/teddycloud-homeassistant-card.js www/teddycloud-homeassistant-card.js
          node tests/test_card_layouts.cjs
      - name: Validate package metadata and translations
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("custom_components/teddycloud_homeassistant")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["domain"] == root.name
          assert manifest["name"] == "TeddyCloud Home Assistant Integration"
          assert manifest["version"] == "0.3.7"
          assert manifest["codeowners"] == ["@mirkohd1999"]
          assert (root / "brand" / "icon.png").is_file()

          hacs = json.loads(Path("hacs.json").read_text())
          assert hacs["name"] == manifest["name"]

          def leaf_keys(data, prefix=""):
              keys = set()
              for name, value in data.items():
                  key = f"{prefix}.{name}" if prefix else name
                  keys |= leaf_keys(value, key) if isinstance(value, dict) else {key}
              return keys

          de = json.loads((root / "translations/de.json").read_text())
          en = json.loads((root / "translations/en.json").read_text())
          strings = json.loads((root / "strings.json").read_text())
          assert leaf_keys(de) == leaf_keys(en) == leaf_keys(strings)

          for path in Path("custom_components").rglob("*.json"):
              json.loads(path.read_text())
          print("HACS package metadata and UI translations validated.")
          PY
