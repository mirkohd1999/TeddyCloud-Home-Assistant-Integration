name: Publish simplified dashboard v0.3.4

on:
  workflow_run:
    workflows:
      - Validate HACS integration
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify the validated release version
        id: version
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("custom_components/teddycloud_homeassistant/manifest.json").read_text())
          version = manifest["version"]
          if version != "0.3.4":
              print(f"Validated main version {version} is not v0.3.4; no release to create.")
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - name: Publish tagged GitHub release if absent
        if: steps.version.outputs.version == '0.3.4'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; keeping it unchanged."
            exit 0
          fi
          sed '/^\*\*Release-Hinweis:/d' RELEASE_NOTES.md > /tmp/teddycloud-release-notes.md
          gh release create "$TAG" \
            --target "$COMMIT_SHA" \
            --title "TeddyCloud Home Assistant Integration $TAG" \
            --notes-file /tmp/teddycloud-release-notes.md \
            --latest
